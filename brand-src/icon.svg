<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Original artwork for this project: a progress ring (credits left)
       around a coin whose face shows one path splitting into three (one key,
       many models). Deliberately not OpenRouter's mark. No text.
       BODY/DETAIL are replaced per theme by make_brand.py; only the ring's
       filled part and the source dot are green. -->

  <!-- Ring track and remaining credits (about 70%) -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="BODY" stroke-width="20" opacity="0.2"/>
  <path d="M128 32 A96 96 0 1 1 36.7 157.7" fill="none" stroke="#10B981" stroke-width="20"
        stroke-linecap="round"/>

  <!-- Coin with routes -->
  <circle cx="128" cy="128" r="54" fill="BODY"/>
  <g stroke="DETAIL" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M100 128 H120 C132 128 134 108 150 108"/>
    <path d="M120 128 H152"/>
    <path d="M120 128 C132 128 134 148 150 148"/>
  </g>
  <circle cx="100" cy="128" r="9" fill="#10B981"/>
  <g fill="DETAIL">
    <circle cx="156" cy="108" r="7"/>
    <circle cx="158" cy="128" r="7"/>
    <circle cx="156" cy="148" r="7"/>
  </g>
</svg>
