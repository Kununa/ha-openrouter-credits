<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Original artwork for this project: a credit gauge above a coin stack.
       No logos or text. BODY/DETAIL are replaced per theme by make_brand.py;
       only the filled part of the gauge is green. -->

  <!-- Gauge track and filled part (about 70%) -->
  <path d="M40 132 A88 88 0 0 1 216 132" fill="none" stroke="BODY" stroke-width="22"
        stroke-linecap="round" opacity="0.25"/>
  <path d="M40 132 A88 88 0 0 1 184.6 64.6" fill="none" stroke="#10B981" stroke-width="22"
        stroke-linecap="round"/>

  <!-- Needle and hub -->
  <line x1="128" y1="132" x2="170" y2="84" stroke="BODY" stroke-width="10" stroke-linecap="round"/>
  <circle cx="128" cy="132" r="14" fill="BODY"/>
  <circle cx="128" cy="132" r="5" fill="DETAIL"/>

  <!-- Coin stack -->
  <g fill="BODY">
    <rect x="68" y="204" width="120" height="22" rx="11"/>
    <rect x="76" y="178" width="104" height="22" rx="11"/>
    <rect x="86" y="152" width="84" height="22" rx="11"/>
  </g>
  <g fill="DETAIL" opacity="0.9">
    <rect x="84" y="213" width="88" height="4" rx="2"/>
    <rect x="92" y="187" width="72" height="4" rx="2"/>
    <rect x="102" y="161" width="52" height="4" rx="2"/>
  </g>
</svg>
